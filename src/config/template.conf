# Default nuui config
title [
    w: width - 2
    h: 3
    x: 1
    y: 0
    pd: 0
    bd: heavy
    fg: none
    bg: cyan
    md: hidden
]

tabs [
    w: width
    h: 3
    x: 0
    y: 3
    pd: 1
    bd: rounded
    fg: rgb(0, 0, 200)
    bg: none
    md: dim
]

main [
    w: width
    h: height - 6
    x: 0
    y: 6
    pd: 1
    bd: light
    fg: yellow
    bg: none
    md: dim
]
